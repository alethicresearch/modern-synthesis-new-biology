name: One-off EMA NAM VDS pilot update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-add-ema-vds-pilot.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add EMA voluntary NAM data submission pilot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/events.json')
          data = json.loads(path.read_text())
          rid = '2026-09-01-ema-nam-vds-pilot'
          if not any(r.get('id') == rid for r in data['events']):
              event = {
                  'id': rid,
                  'date': '2026-09-01',
                  'display_date': 'Sep 1, 2026',
                  'temporal_status': 'observed',
                  'institution': 'European Medicines Agency (EMA)',
                  'title': 'EMA launches voluntary NAM data-submission pilot',
                  'summary': 'EMA launches a voluntary data submission pilot allowing companies, method developers, CROs and academic laboratories to submit NAM data outside marketing-authorisation applications for independent, non-binding scientific assessment and feedback on regulatory readiness. The pilot is intended to build regulatory experience and direct developers toward next steps such as the Innovation Task Force, scientific advice or qualification advice; it does not itself confer qualification or regulatory acceptance.',
                  'why_it_matters': 'Creates a structured regulatory-learning pathway that decouples NAM evidence review from individual product applications, lowering the cost and perceived submission risk of early regulator engagement while building experience that could support later qualification and harmonised assessment.',
                  'stage': ['qualification', 'review-infrastructure'],
                  'domain': ['nams', 'regulatory-science', 'qualification', 'regulatory-readiness', 'international-convergence'],
                  'materiality': 'high',
                  'major_milestone': True,
                  'source_status': 'primary_source_verified',
                  'source_url': 'https://www.ema.europa.eu/en/human-regulatory-overview/research-development/ethical-use-animals-medicine-testing/regulatory-acceptance-new-approach-methodologies-nams-reduce-animal-use-testing/new-approach-methodologies-replace-reduce-animal-testing-voluntary-data-submission-pilot',
                  'manuscript_ref': None,
                  'manuscript_impacts': [
                      {
                          'section': 'III/VI',
                          'claim': 'Regulatory confidence in human-based methods increasingly depends on institutional pathways that accumulate and assess evidence before routine product adoption',
                          'effect': 'strengthens'
                      },
                      {
                          'section': 'VII',
                          'claim': 'Regulatory learning can be made more reusable and harmonised rather than remaining confined to individual sponsor submissions',
                          'effect': 'strengthens'
                      },
                      {
                          'section': 'Table 3',
                          'claim': 'Qualification and regulatory-engagement milestones should track structured pathways for regulator review of NAM evidence outside marketing-authorisation applications',
                          'effect': 'requires_update'
                      }
                  ]
              }
              data['events'].append(event)
              data['events'].sort(key=lambda r: r.get('date', ''))
          data['updated'] = '2026-09-03'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Commit event and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-add-ema-vds-pilot.yml
          git config user.name 'xnuxi'
          git config user.email 'research@alethic.ai'
          git add data/events.json .github/workflows/oneoff-add-ema-vds-pilot.yml
          git commit -m 'Add EMA voluntary NAM data-submission pilot'
          git push
