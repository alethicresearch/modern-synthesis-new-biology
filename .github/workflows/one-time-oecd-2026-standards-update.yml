# one-time updater trigger
name: One-time OECD 2026 standards update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-oecd-2026-standards-update.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Install one-time OECD standards updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add verified OECD 2026 in-vitro standards event
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/events.json')
          data=json.loads(p.read_text())
          rid='2026-07-02-oecd-invitro-test-guidelines'
          if not any(e.get('id')==rid for e in data['events']):
              data['events'].append({
                  'id': rid,
                  'date':'2026-07-02',
                  'display_date':'Jul 2, 2026',
                  'temporal_status':'observed',
                  'institution':'OECD',
                  'title':'OECD adds new in-vitro methods to internationally recognized Test Guidelines',
                  'summary':'OECD publishes its 2026 Test Guideline package, including three new in-vitro health-effects guidelines: TG 445A using differentiated human hepatic cells for CYP induction, TG 446A ToxTracker for mechanistic genotoxicity, and TG 454A using a human glucocorticoid-receptor transactivation assay. The same package expands validated in-vitro and defined approaches in existing skin-sensitisation and phototoxicity guidelines.',
                  'why_it_matters':'Moves multiple non-animal methods from development and validation into internationally recognized chemical-safety standards that OECD states are used for regulatory purposes and form part of the Mutual Acceptance of Data system. This is standards-level qualification and convergence, not evidence that a particular regulator has displaced a specific animal study in a named decision.',
                  'stage':['qualification','international-convergence'],
                  'domain':['chemicals','standards','in-vitro','human-cells','genotoxicity','liver','endocrine'],
                  'materiality':'high',
                  'major_milestone':True,
                  'source_status':'primary_source_verified',
                  'manuscript_ref':None,
                  'source_url':'https://www.oecd.org/en/topics/sub-issues/testing-of-chemicals/test-guidelines.html',
                  'manuscript_impacts':[
                      {'section':'III/VI','claim':'Reusable credibility increasingly includes internationally standardized non-animal methods','effect':'strengthens'},
                      {'section':'VII','claim':'International convergence can occur through standards infrastructure as well as regulator-to-regulator coordination','effect':'strengthens'},
                      {'section':'Table 3','claim':'Standards and qualification milestones should recognize OECD-level method standardization as an observable transition outcome','effect':'requires_update'}
                  ]
              })
          data['events'].sort(key=lambda e: (e.get('date',''), e.get('id','')))
          data['updated']='2026-09-01'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False)+'\n')
          PY
          python scripts/validate_data.py
      - name: Commit roadmap update
        run: |
          git config user.name 'xnuxi'
          git config user.email 'research@alethic.ai'
          git add data/events.json
          if git diff --cached --quiet; then
            echo 'No event change required.'
            exit 0
          fi
          git commit -m 'Add OECD 2026 in-vitro Test Guideline milestone'
          git push
