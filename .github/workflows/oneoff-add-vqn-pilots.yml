name: One-off VQN pilot-project event update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-add-vqn-pilots.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add verified VQN pilot-project event
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/events.json')
          data = json.loads(path.read_text())
          rid = '2026-07-22-fnih-vqn-three-additional-pilots'
          if not any(r.get('id') == rid for r in data['events']):
              data['events'].append({
                  'id': rid,
                  'date': '2026-07-22',
                  'display_date': 'Jul 22, 2026',
                  'temporal_status': 'observed',
                  'institution': 'FNIH / NIH Complement-ARIE VQN',
                  'title': 'VQN expands to seven human-based NAM pilot projects',
                  'summary': 'FNIH selected three additional human-based research platforms for development into Validation and Qualification Network pilot projects, bringing the total under development to seven. The new pilots address developmental toxicity, cardiac safety, and cancer-therapy response. Selection initiates pilot development and validation-oriented team formation; it is not a regulatory qualification decision.',
                  'why_it_matters': 'Shows the Complement-ARIE VQN moving from partnership design into a concrete portfolio of human-based platforms intended for validation and regulatory-readiness work, while preserving the distinction between pilot selection, validation, qualification, and adoption.',
                  'stage': ['qualification', 'validation-infrastructure'],
                  'domain': ['complement-arie', 'vqn', 'validation', 'human-based-models', 'developmental-toxicity', 'cardiac-safety', 'cancer'],
                  'materiality': 'medium',
                  'major_milestone': False,
                  'source_status': 'primary_source_verified',
                  'manuscript_ref': None,
                  'source_url': 'https://fnih.org/news/three-more-nams-pilot-projects-selected/',
                  'manuscript_impacts': [
                      {
                          'section': 'III/VI',
                          'claim': 'Complement-ARIE VQN is becoming operational validation infrastructure rather than remaining only a proposed partnership',
                          'effect': 'strengthens'
                      },
                      {
                          'section': 'Table 3 / validation milestones',
                          'claim': 'Priority human-based platforms are entering structured validation-oriented development pipelines',
                          'effect': 'strengthens'
                      }
                  ]
              })
              data['events'].sort(key=lambda r: r.get('date', ''))
          data['updated'] = '2026-09-02'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Commit event and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-add-vqn-pilots.yml
          git config user.name 'xnuxi'
          git config user.email 'research@alethic.ai'
          git add data/events.json .github/workflows/oneoff-add-vqn-pilots.yml
          git commit -m 'Add July 2026 VQN pilot expansion event'
          git push
