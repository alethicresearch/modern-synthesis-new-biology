name: One-off ISO 25591 stage correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-correct-iso-25591.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct unsupported ISO 25591 DIS-stage record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          bad_id = '2026-09-04-iso-mps-digital-twin-dis'

          events_path = Path('data/events.json')
          events = json.loads(events_path.read_text())
          before = len(events['events'])
          events['events'] = [r for r in events['events'] if r.get('id') != bad_id]
          if len(events['events']) == before:
              raise SystemExit(f'{bad_id} not found in events.json')
          events['updated'] = '2026-09-08'
          events_path.write_text(json.dumps(events, indent=2, ensure_ascii=False) + '\n')

          prospective_path = Path('data/prospective.json')
          prospective = json.loads(prospective_path.read_text())
          for m in prospective.get('milestones', []):
              if m.get('id') == 'prospective-composable-qualification':
                  m['linked_event_ids'] = [x for x in m.get('linked_event_ids', []) if x != bad_id]
          prospective['updated'] = '2026-09-08'
          prospective_path.write_text(json.dumps(prospective, indent=2, ensure_ascii=False) + '\n')

          handoff_path = Path('RESEARCH_HANDOFF.md')
          text = handoff_path.read_text()
          text = text.replace('Updated: 2026-08-31', 'Updated: 2026-09-08', 1)
          old = "## Research round — 2026-09-06\n\nFresh primary-source scan covered FDA, NIH/Common Fund/FNIH, EPA, EMA, MHRA/UK, PMDA, Health Canada, TGA, Swissmedic, OECD, ISO, and major MPS/OoC industry developers. One material advancement was verified: ISO 25591 progressed beyond Committee Draft consultation and was approved for registration as a Draft International Standard on 4 Sep 2026. Added as a separate emerging qualification/validation-infrastructure event rather than rewriting the July Committee Draft record. No prospective milestone changed status; `prospective-composable-qualification` remains `in_progress` and now links the DIS-stage event. No other new item found in this round cleared the protocol's materiality/verification threshold."
          new = "## Research round — 2026-09-06 (corrected 2026-09-08)\n\nThe prior round overstated the ISO 25591 stage. On re-checking ISO's current primary record on 8 Sep 2026, ISO 25591 is still listed as **ISO/CD 25591 — Committee Draft, under development, being reviewed by the committee**. No primary ISO record could be verified showing registration as a Draft International Standard. The unsupported 4 Sep DIS-stage event was therefore removed from `data/events.json`, and its link was removed from `prospective-composable-qualification`. The verified 8 Jul Committee Draft event remains. The prospective composable-qualification milestone remains `in_progress` because the Committee Draft itself still represents active standards work on regulatory-ready MPS/OoC data, reproducibility, provenance, and versioning.\n\nA fresh 8 Sep primary-source scan across FDA, NIH/Common Fund/FNIH, EPA, EMA, MHRA/UK, PMDA, Health Canada, TGA, European Commission/JRC, OECD, ISO, and industry/MPS searches found no additional development since the prior verified roadmap updates that cleared the protocol's materiality and verification thresholds."
          if old not in text:
              raise SystemExit('Expected 2026-09-06 handoff paragraph not found')
          text = text.replace(old, new)
          handoff_path.write_text(text)
          PY
      - name: Validate data
        run: python scripts/validate_data.py
      - name: Commit correction and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-correct-iso-25591.yml
          git config user.name 'xnuxi'
          git config user.email 'research@alethic.ai'
          git add data/events.json data/prospective.json RESEARCH_HANDOFF.md .github/workflows/oneoff-correct-iso-25591.yml
          git commit -m 'Correct ISO 25591 stage to Committee Draft'
          git push