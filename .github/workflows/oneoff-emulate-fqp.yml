name: One-off Emulate ISTAND FQP update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-emulate-fqp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update roadmap records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          events_path = Path('data/events.json')
          events = json.loads(events_path.read_text())
          rid = '2026-09-09-emulate-liver-chip-fqp'
          if not any(r.get('id') == rid for r in events['events']):
              events['events'].append({
                  'id': rid,
                  'date': '2026-09-09',
                  'display_date': 'Sep 9, 2026',
                  'temporal_status': 'observed',
                  'institution': 'Emulate / FDA ISTAND',
                  'title': 'Human Liver-Chip full qualification package submitted to FDA ISTAND',
                  'summary': 'Emulate reports submission of the Full Qualification Package for its Human Liver-Chip to FDA\'s ISTAND Drug Development Tool Qualification Program for drug-induced liver injury assessment. The package includes data from the Zoe and AVA Organ-Chip platforms and cross-laboratory reproducibility data. Submission of an FQP is the final submission stage in the qualification process, but FDA has not yet qualified the tool.',
                  'why_it_matters': 'Advances the first organ-on-chip accepted into ISTAND from Letter-of-Intent entry to the final qualification-submission stage and places a reusable MPS qualification decision within reach. The reported package also directly addresses cross-site reproducibility and scalability, while remaining distinct from an FDA qualification decision or routine regulatory adoption.',
                  'stage': ['qualification'],
                  'domain': ['mps', 'organ-on-chip', 'liver', 'dili', 'istand', 'reproducibility'],
                  'materiality': 'high',
                  'major_milestone': True,
                  'source_status': 'primary_source_verified',
                  'source_url': 'https://www.businesswire.com/news/home/20260909272720/en/',
                  'manuscript_ref': None,
                  'manuscript_impacts': [
                      {
                          'section': 'III/VI',
                          'claim': 'Reusable qualification of human-based platforms can progress through formal regulator-defined stages rather than remain sponsor-specific validation',
                          'effect': 'strengthens'
                      },
                      {
                          'section': 'Table 3 / qualification milestones',
                          'claim': 'The first reusable regulatory qualification of an MPS has advanced to the final full-package submission stage',
                          'effect': 'requires_update'
                      },
                      {
                          'section': 'VII',
                          'claim': 'Cross-site reproducibility and scalable platform transfer are becoming part of the evidence package for reusable regulatory credibility',
                          'effect': 'strengthens'
                      }
                  ]
              })
          events['events'].sort(key=lambda r: r.get('date', ''))
          events['updated'] = '2026-09-09'
          events_path.write_text(json.dumps(events, indent=2, ensure_ascii=False) + '\n')

          prospective_path = Path('data/prospective.json')
          prospective = json.loads(prospective_path.read_text())
          for m in prospective['milestones']:
              if m.get('id') == 'prospective-mps-reusable-qualification':
                  m['status'] = 'in_progress'
                  if rid not in m.setdefault('linked_event_ids', []):
                      m['linked_event_ids'].append(rid)
              elif m.get('id') == 'prospective-cross-site-reproducibility':
                  if rid not in m.setdefault('linked_event_ids', []):
                      m['linked_event_ids'].append(rid)
          prospective['updated'] = '2026-09-09'
          prospective_path.write_text(json.dumps(prospective, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Commit update and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-emulate-fqp.yml
          git config user.name 'xnuxi'
          git config user.email 'research@alethic.ai'
          git add data/events.json data/prospective.json .github/workflows/oneoff-emulate-fqp.yml
          git commit -m 'Add Emulate Liver-Chip ISTAND full qualification package submission'
          git push
